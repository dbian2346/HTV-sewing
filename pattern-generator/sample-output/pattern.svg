<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="810mm" height="900mm" viewBox="0 0 810 900">
<title>Everyday gathered skirt pattern at 1:1 scale</title>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#34647b"/></marker></defs>
<style>.cut{stroke:#111;stroke-width:.5}.stitch{stroke:#777;stroke-width:.3;stroke-dasharray:3 2}.fold{stroke:#bd372f;stroke-width:.6;stroke-dasharray:5 2}.grain{stroke:#34647b;stroke-width:.5}.guide{stroke:#aaa;stroke-width:.25}text{font-family:Arial,sans-serif;fill:#222}</style>
<rect width="100%" height="100%" fill="white"/>
<line class="cut" x1="20" y1="20" x2="410" y2="20"/>
<line class="cut" x1="410" y1="20" x2="410" y2="580"/>
<line class="cut" x1="410" y1="580" x2="20" y2="580"/>
<line class="fold" x1="20" y1="580" x2="20" y2="20"/>
<line class="stitch" x1="20" y1="30" x2="400" y2="30"/>
<line class="stitch" x1="400" y1="30" x2="400" y2="570"/>
<line class="stitch" x1="400" y1="570" x2="20" y2="570"/>
<line class="grain" x1="215" y1="100" x2="215" y2="500" marker-end="url(#arrow)"/>
<line class="cut" x1="20" y1="600" x2="790" y2="600"/>
<line class="cut" x1="790" y1="600" x2="790" y2="700"/>
<line class="cut" x1="790" y1="700" x2="20" y2="700"/>
<line class="fold" x1="20" y1="700" x2="20" y2="600"/>
<line class="stitch" x1="20" y1="610" x2="780" y2="610"/>
<line class="stitch" x1="780" y1="610" x2="780" y2="690"/>
<line class="stitch" x1="780" y1="690" x2="20" y2="690"/>
<line class="grain" x1="405" y1="628" x2="405" y2="672" marker-end="url(#arrow)"/>
<line class="fold" x1="20" y1="650" x2="780" y2="650"/>
<line class="cut" x1="20" y1="720" x2="638" y2="720"/>
<line class="cut" x1="638" y1="720" x2="638" y2="880"/>
<line class="cut" x1="638" y1="880" x2="20" y2="880"/>
<line class="fold" x1="20" y1="880" x2="20" y2="720"/>
<line class="stitch" x1="20" y1="730" x2="628" y2="730"/>
<line class="stitch" x1="628" y1="730" x2="628" y2="850"/>
<line class="fold" x1="628" y1="850" x2="20" y2="850"/>
<line class="grain" x1="329" y1="764.8" x2="329" y2="835.2" marker-end="url(#arrow)"/>
<text x="32" y="80" font-size="5">Skirt panel</text>
<text x="32" y="88" font-size="3.5">Cut 2 on fold</text>
<text x="32" y="96" font-size="3.2">390.0 x 560.0 mm cut</text>
<text x="370" y="300" font-size="2.8">side 10 mm</text>
<text x="23" y="300" font-size="3" writing-mode="tb">PLACE ON FOLD</text>
<text x="32" y="620" font-size="5">Waistband casing</text>
<text x="32" y="628" font-size="3.5">Cut 1 on fold; fold across center</text>
<text x="32" y="636" font-size="3.2">770.0 x 100.0 mm cut</text>
<text x="750" y="650" font-size="2.8">side 10 mm</text>
<text x="85" y="647" font-size="3">FOLD CASING HERE</text>
<text x="23" y="650" font-size="3" writing-mode="tb">PLACE ON FOLD</text>
<text x="32" y="752" font-size="5">Ruffle panel</text>
<text x="32" y="760" font-size="3.5">Cut 2 on fold; gather top</text>
<text x="32" y="768" font-size="3.2">618.0 x 160.0 mm cut</text>
<text x="598" y="800" font-size="2.8">side 10 mm</text>
<text x="85" y="847" font-size="3">HEM FOLD</text>
<text x="23" y="800" font-size="3" writing-mode="tb">PLACE ON FOLD</text>
</svg>
